# Cellar workspace — virtual manifest (blueprint §4, ADR 0002).
#
# Every crate lives under crates/; metadata, dependency versions, and lints
# are inherited from this file (single source of truth). The dependency graph
# is a DAG enforced by Cargo: cycles are compile errors. `cellar-cli` is the
# primary member; `cellar-gui` becomes primary later via `default-members`.
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/cellar-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Siddhj2206/cellar"

# Single source of truth for dependency versions; members use `x.workspace = true`.
# Error handling: the port traits keep their sealed typed errors (ADR 0003);
# presentation normalizes them with `anyhow` (AGENTS.md) — the CLI's `run()`
# converts port errors at the presentation boundary.
[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
zip = "2"

[workspace.lints.rust]
# Layer rules, enforced not aspirational (blueprint §4).
unsafe_code = "forbid"

[workspace.lints.clippy]
# Clippy pedantic applies workspace-wide with no per-crate opt-outs; any
# warning is a build failure under `cargo clippy`. The priorities below (-1 on
# groups) let the workspace-wide `allow`s win over the deny groups.
pedantic = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
# Workspace-wide relaxations of pedantic, uniform across all members:
# doc-comment obligations land with the doctor/CLI slices; `must_use` on pure
# getters is noise here.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"